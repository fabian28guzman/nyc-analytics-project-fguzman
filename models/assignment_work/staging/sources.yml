version: 2
sources:
  - name: raw
    description: Raw data loaded from NYC Open Data
    database: sp26dwfg
    schema: nyc_group_raw_data
    tables:
      - name: source_nyc_open_housing_maintenance_code_violations
        description: |
          NYC 311 service requests for Dept of Transportation.
          One row per service request.
        columns:
          - name: ViolationID
            description: Unique identifier of Violation
            tests:
              - unique
              - not_null
          - name: BuildingID
            description: Unique identifier of building
          - name: RegistrationID
            description: Unique identifier of valid registration information
          - name: BoroID
            description: Borough code
          - name: Borough
            description: The borough where the building is located
          - name: HouseNumber
            description: 'The street number in the building's address. E.g.:the house number is'100' in '100 Gold Street'
          - name: LowHouseNumber
            description: If there is a range for a building, the lowest house number in the building’s address.
          - name: HighHouseNumber
            description: If there is a range for a building, the highest house number in the building’s address.
          - name: StreetName
            description: "The name of the street in the building's address. E.g.: the street name is 'Gold Street' in '100 Gold Street'" 
          - name: StreetCode
            description: 
          - name: Postcode
            description: The postcode where the building is located
          - name: Apartment
            description: Apartment in violation, if applicable
          - name: Story
            description: Floor of violation
          - name: Block
            description: Tax block for building
          - name: Lot
            description: Tax lot for building
          - name: Class
            description: "Indicator of seriousness of the violations, where A is the least serious and C is the most serious. Class I violation are informational notices that do not have certification periods associated; they indicate something about the status of the property: that an Order is open against the property (example:Order to Repair/Vacate Order) or that a property is vacant or that a property is not validly registered."
          - name: InspectionDate
            description: Date when the violation was observed
          - name: ApprovedDate
            description: Date when the violation was approved
          - name: OriginalCertifyByDate
            description: Original date by which the owner was to inform HPD that the violation was corrected
          - name: OriginalCorrectByDate
            description: Original date by which the owner was to correct the violation
          - name: NewCertifyByDate
            description: If a postponement is granted, a new certify by date is established
          - name: NewCorrectByDate
            description: If a postponement is granted, a new correct by date is established
          - name: CertifiedDate
            description: Date when the violation was certified by the owner
          - name: OrderNumber
            description: Reference to the abstract description of the violation condition which cites a specific section of the law which is in violation
          - name: NOVID
            description: Unique identifier of the Notice of Violation sent to the owner
          - name: NOVDescription
            description: Description of the violation
          - name: NOVIssuedDate
            description: Date when the NOV was sent
          - name: CurrentStatusID
            description: Unique identifier affiliated with the current violation status
          - name: CurrentStatus
            description: Current violation status
          - name: CurrentStatusDate
            description: Date when the current status went into effect
          - name: NovType
            description: Original/Reissued Notice of Violation.
          - name: ViolationStatus
            description: Status of Violation
          - name: RentImpairing
            description: A rent-impairing violation is a condition within a multiple dwelling which constitutes, or if not promptly corrected will constitute, a fire hazard or a serious threat to the life, health or safety of occupants thereof (New York State Multiple Dwelling Law Section 302).
          - name: Latitude
            description: Latitude and longitude specify the location of the property on the earth's surface. The coordinates provided are an estimate of the location based on the street segment and address range.
          - name: Longitude
            description: 
          - name: CommunityBoard
            description: Community Board indicates the New York City Community District where the building is located
          - name: CouncilDistrict
            description: Council District indicates the New York City Council District where the building is located
          - name: CensusTract
            description: Geographic area defined by the U.S. Census Bureau for the various decennial censuses.
          - name: BIN
            description: The BIN (Building Identification Number) is a unique identifier for each building in the City.
          - name: BBL
            description: BBL is a unique identifier for each tax lot in the city.
          - name: NTA
            description: 'Each row in this dataset contains discrete information about one violation of the New York City Housing Maintenance Code or New York State Multiple Dwelling Law.             Each violation is identified using a unique Violation ID. These Laws are in place to provide requirements for the maintenance of residential dwelling units within New York City.'
      - name: 311_hpd_service_requests_history
        description: |
          'Each row of data contains information about the service request, including complaint type, responding agency, and geographic location. However the data does not reveal any personally identifying information about the customer who made the request.''
        columns:
          - name: Unique Key
            description: Unique identifier of a Service Request (SR) in the open data set
            tests:
              - unique
              - not_null
          - name: Created Date
            description: Date SR was created
          - name: Closed Date
            description: Date SR was closed by responding agency
          - name: Agency
            description: Acronym of responding City Government Agency
          - name: Agency Name
            description: Full Agency name of responding City Government Agency
          - name: Problem (formerly Complaint Type)
            description: This is the first level of a hierarchy identifying the topic of the incident or condition. Problem (formerly Complaint Type) broadly describes the topic of the incident or condition and are defined by the responding agencies. New Problems may be added in response to changes in customer demand.
          - name: Problem Detail (formerly Descriptor)
            description: This is associated to the Problem (formerly Complaint Type), and provides further detail on the incident or condition. Problem Detail (formerly Descriptor) values are dependent on the Problem, and are not always required in the service request.
          - name: Additional Details
            description: A third level of detail about the Problem (formerly Complaint Type) beyond the Problem Detail (formerly Descriptor). This is not used by every category of issue.
          - name: Location Type
            description: Describes the type of location used in the address information
          - name: Incident Zip
            description: Incident location zip code, provided by geo validation.
          - name: Incident Address
            description: House number of incident address provided by submitter.
          - name: Street Name
            description: Street name of incident address provided by the submitter
          - name: Cross Street 1
            description: First Cross street based on the geo validated incident location
          - name: Cross Street 2
            description: Second Cross Street based on the geo validated incident location
          - name: Intersection Street 1
            description: First intersecting street based on geo validated incident location
          - name: Intersection Street 2
            description: Second intersecting street based on geo validated incident location
          - name: Address Type
            description: Type of incident location information available.
          - name: City
            description: City of the incident location provided by geovalidation.
          - name: Landmark
            description: If the incident location is identified as a Landmark the name of the landmark will display here
          - name: Facility Type
            description: If available, this field describes the type of city facility associated to the SR
          - name: Status
            description: Status of SR submitted
          - name: Due Date
            description: Date when responding agency is expected to update the SR. This is based on the Complaint Type and internal Service Level Agreements (SLAs).
          - name: Resolution Description
            description: Describes the last action taken on the SR by the responding agency. May describe next or future steps.
          - name: Resolution Action Updated Date
            description: Date when responding agency last updated the SR.
          - name: Community Board
            description: Provided by geovalidation.
          - name: Council District
            description: The City Council district where the service request is located.
          - name: Police Precinct
            description: The NYPD precinct where the service request is located.
          - name: BBL
            description: Borough Block and Lot, provided by geovalidation. Parcel number to identify the location of location of buildings and properties in NYC.
          - name: Borough
            description: Provided by the submitter and confirmed by geovalidation.
          - name: X Coordinate (State Plane)
            description: Geo validated, X coordinate of the incident location.
          - name: Y Coordinate (State Plane)
            description: Geo validated, Y coordinate of the incident location.
          - name: Open Data Channel Type
            description: Indicates how the SR was submitted to 311. i.e. By Phone, Online, Mobile, Other or Unknown.
          - name: Park Facility Name
            description: If the incident location is a Parks Dept facility, the Name of the facility will appear here
          - name: Park Borough
            description: The borough of incident if it is a Parks Dept facility
          - name: Vehicle Type
            description: If the incident is a taxi, this field describes the type of TLC vehicle.
          - name: Taxi Company Borough
            description: If the incident is identified as a taxi, this field will display the borough of the taxi company.
          - name: Taxi Pick Up Location
            description: If the incident is identified as a taxi, this field displays the taxi pick up location
          - name: Bridge Highway Name
            description: If the incident is identified as a Bridge/Highway, the name will be displayed here.
          - name: Bridge Highway Direction
            description: If the incident is identified as a Bridge/Highway, the direction where the issue took place would be displayed here.
          - name: Road Ramp
            description: If the incident location was Bridge/Highway this column differentiates if the issue was on the Road or the Ramp.
          - name: Bridge Highway Segment
            description: Additional information on the section of the Bridge/Highway were the incident took place.
          - name: Latitude
            description: Geo based Lat of the incident location
          - name: Longitude
            description: Geo based Long of the incident location
          - name: Location
            description: Combination of the geo based lat & long of the incident location