version: 2

sources:
  - name: raw
    database: sp26dwfg
    schema: nyc_group_raw_data
    tables:
      - name: 311_hpd_service_requests_history
        description: |
          NYC 311 service requests for HPD "No Heat" service request.
          One row per service request.
        columns:
          - name: unique_key
            description: Unique ID for the service request
            tests:
              - unique
              - not_null
          - name: created_date
            description: Date and time the request was created
          - name: closed_date
            description: Date and time the request was closed
          - name: agency
            description: Agency code
          - name: agency_name
            description: Full name of the agency
          - name: complaint_type
            description: Type of complaint
          - name: descriptor
            description: Further description of the complaint
          - name: location_type
            description: Location where the incident occurred
          - name: incident_zip
            description: Zip code of the incident location
          - name: incident_address
            description: Street address of the incident
          - name: latitude
            description: Latitude coordinate
          - name: longitude
            description: Longitude coordinate
          - name: address_type
            description: Type of address (e.g., ADDRESS, INTERSECTION, BLOCKFACE)
          - name: bbl
            description: Borough Block and Lot number (NYC tax lot id)
          - name: borough
            description: NYC borough where incident occurred
          - name: city
            description: City name where incident occurred
          - name: community_board
            description: NYC Community Board district number
          - name: council_district
            description: The City Council district where the service request is located
          - name: descriptor_2
            description: Additional description of the complaint
          - name: open_data_channel_type
            description: How request was submitted (ONLINE, PHONE, MOBILE, etc.)
          - name: park_borough
            description: Borough of park where incident occurred
          - name: park_facility_name
            description: Name of park facility where incident occurred
          - name: police_precinct
            description: The NYPD precinct where the service request is located
          - name: resolution_action_updated_date
            description: Date when responding agency last updated the service request
          - name: resolution_description
            description: Description of how the request was resolved
          - name: status
            description: Current status of request (Open, Closed, In Progress, etc.)
          - name: street_name
            description: Name of street where incident occurred
          - name: x_coordinate_state_plane
            description: X coordinate in NY State Plane projection system (NAD 83)
          - name: y_coordinate_state_plane
            description: Y coordinate in NY State Plane projection system (NAD 83)

      - name: source_nyc_open_housing_maintenance_code_violations
        description: |
          NYC Housing Maintenance Code violations.
          One row per violation record.
        columns:
          - name: violationid
            description: Unique identifier of violation
          - name: buildingid
            description: Unique identifier of building
          - name: registrationid
            description: Unique identifier of valid registration information
          - name: boroid
            description: Borough code (1=Manhattan, 2=Bronx, 3=Brooklyn, 4=Queens, 5=Staten Island)
          - name: borough
            description: Borough where the building is located
          - name: housenumber
            description: Street number of the building address
          - name: lowhousenumber
            description: Lowest house number if building has a range
          - name: highhousenumber
            description: Highest house number if building has a range
          - name: streetname
            description: Name of the street
          - name: streetcode
            description: Street code identifier
          - name: postcode
            description: Postal code of the building
          - name: apartment
            description: Apartment in violation if applicable
          - name: story
            description: Floor where violation occurred
          - name: block
            description: Tax block for building
          - name: lot
            description: Tax lot for building
          - name: class
            description: Violation severity (A = least serious, C = most serious)
          - name: inspectiondate
            description: Date when violation was observed
          - name: approveddate
            description: Date when violation was approved
          - name: originalcertifybydate
            description: Original deadline to certify correction
          - name: originalcorrectbydate
            description: Original deadline to correct violation
          - name: newcertifybydate
            description: Updated certify-by date if extended
          - name: newcorrectbydate
            description: Updated correct-by date if extended
          - name: certifieddate
            description: Date when violation was certified by owner
          - name: ordernumber
            description: Code representing violation type
          - name: novid
            description: Notice of Violation identifier
          - name: novdescription
            description: Description of the violation
          - name: novissuedate
            description: Date when notice was issued
          - name: currentstatusid
            description: Identifier for current violation status
          - name: currentstatus
            description: Current violation status
          - name: currentstatusdate
            description: Date when current status took effect
          - name: novtype
            description: Type of Notice of Violation (original/reissued)
          - name: violationstatus
            description: Status of violation (Open/Close)
          - name: rentimpairing
            description: Indicates serious housing condition affecting safety
          - name: latitude
            description: Latitude coordinate
          - name: longitude
            description: Longitude coordinate
          - name: communityboard
            description: NYC Community Board district
          - name: councildistrict
            description: NYC Council District
          - name: censustract
            description: Census tract identifier
          - name: bin
            description: Building Identification Number
          - name: bbl
            description: Borough-Block-Lot identifier
          - name: nta
            description: Neighborhood Tabulation Area